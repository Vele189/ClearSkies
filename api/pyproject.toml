[project]
name = "clearskies-api"
version = "0.1.0"
description = "ClearSkies REST API: burden scores, hex drill-down, drafting assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "h3>=4.1",
    # CS-303. The slim distribution with only the OpenAI provider: the full
    # package pulls every provider SDK, and this service talks to one.
    "pydantic-ai-slim[openai]>=1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pyyaml>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# asyncpg ships no stubs; its Pool/Connection surface is dynamic.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "h3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
