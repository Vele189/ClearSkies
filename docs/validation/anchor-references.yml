# ClearSkies anchor reference points — CS-111
#
# Independent, externally sourced coordinates used to verify the anchors in
# sites.yml. This file answers the question sites.yml cannot answer about
# itself: does each anchor actually sit in the community it names?
#
# sites.yml is the pre-registered fixture and is closed under methodology
# section 17.4. This file is NOT part of the registered set. It is evidence
# about the set, gathered afterwards, and adding a reference here changes no
# score and no criterion.
#
# Every coordinate carries the authority it came from. Three are used:
#
#   USGS GNIS Domestic Names   — the federal authority for place names.
#                                Vintage: files retrieved 2026-09-11 from
#                                prd-tnm.s3.amazonaws.com/StagedProducts/
#                                GeographicNames/DomesticNames/.
#   US Census Bureau TIGERweb  — county/parish and incorporated place and
#                                census designated place boundaries, current
#                                vintage, queried 2026-09-11.
#   EPA ECHO and EPA FRS       — facility coordinates for the plants and sites
#                                named in each site's citations. ECHO is
#                                already a registered ClearSkies source
#                                (etl/pipeline/adapters/echo.py).
#
# Roles:
#   community  — the populated place the site is named for. At least one
#                community reference must fall inside the site's frozen cells.
#   secondary  — a second community named in a compound site name. Recorded
#                and reported; does not gate verification on its own.
#   citation   — the facility or feature the site's citations name. Reported
#                with its ring distance; a citation outside the frozen cells is
#                a documented note, not automatically a failure, because the
#                cells are anchored on where people live rather than on the
#                fence line.
#
# anchor_county_actual and anchor_place_actual record what the Census says is
# actually at the anchor coordinate, which is what catches a mislabelled parish.
#
# scripts/verify_anchors.py consumes this file and re-checks every anchor
# against it offline. Regenerate only to add or re-source a reference.

retrieved: 2026-09-11
sources:
  gnis: "USGS Geographic Names Information System, Domestic Names, state text files"
  census: "US Census Bureau TIGERweb REST services, current vintage"
  epa: "EPA ECHO air_rest_services and EPA Envirofacts FRS"

