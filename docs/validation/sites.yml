# ClearSkies pre-registered validation set
#
# Committed BEFORE any file under scoring/ exists. CI enforces that ordering,
# and scripts/check_validation_set.py enforces this file's internal consistency.
#
# READ-ONLY from this point. The set is closed. Sites are never added, removed
# or re-anchored; criteria are never loosened. The only permitted change is a
# documented methodology revision recorded in docs/methodology.md section 18,
# which requires re-running the full protocol from the beginning.
#
# Flipping `active` on an out-of-state site when coverage extends is NOT a
# change to the set. That transition and its trigger are pre-declared below,
# which is the entire point of registering those sites now rather than
# choosing them later once a national score already exists.
#
# See docs/methodology.md sections 13 and 17, and Appendix A.

schema_version: 2
methodology_version: "0.1.0"
pilot_state: LA
registered: 2026-09-10
status: closed

# Every site resolves to an explicit set of H3 resolution 8 cells, computed
# once from its anchor with h3.grid_disk(anchor, k) and frozen here. A res-8
# cell averages 0.737 km2 with an edge near 461 m, so k=1 gives 7 cells
# spanning roughly 1.2 km, k=2 gives 19 cells spanning roughly 2.1 km, and
# k=3 gives 37 cells spanning roughly 3.0 km. k is chosen from the physical
# extent of each site, before any score exists.
#
# Anchors carry verified: false until each is checked against the cited
# documentation in Phase 1. Verification may correct an anchor that names the
# wrong community, which is a methodology revision under section 17 and is
# recorded as one. It may not move an anchor to improve a result.

criteria:
  high_burden:
    rule: "at least one of the site's pre-registered cells falls in the statewide top decile"
    threshold_percentile: 90
    required: 8
    of: 10
    applies_to: active sites only
  negative_control:
    rule: "every scored cell of the site falls below the statewide median"
    threshold_percentile: 50
    required: 4
    of: 4
  stress_not_a_poverty_map:
    rule: "expected percentile band; a result outside it triggers a documented investigation, not an automatic failure"
    expected_band: [40, 75]
    gating: false
  stress_not_an_emissions_map:
    rule: "expected below the top decile; a result outside it triggers a documented investigation, not an automatic failure"
    expected_below_percentile: 90
    gating: false

# A site with no scored cell is reported as not_applicable. It is never
# counted as a pass. Section 5 leaves cells under 25 people unscored, which is
# expected to affect the low-population stress cases.

