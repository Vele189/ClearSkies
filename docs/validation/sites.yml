# Reported, never gated. See methodology.md section 13.6.
# Race is not an input to the score, so any correlation found here is an
# empirical result rather than an artifact of construction.
disparity_analysis:
  - metric: spearman_score_percentile_vs_black_population_share
    population_weighted: true
    report_confidence_interval: true
  - metric: spearman_score_percentile_vs_people_of_color_share
    population_weighted: true
    report_confidence_interval: true
