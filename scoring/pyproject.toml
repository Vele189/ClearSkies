[project]
name = "clearskies-scoring"
version = "0.1.0"
description = "ClearSkies scoring: normalization, the two components, and the burden score"
requires-python = ">=3.12"
# Deliberately empty. Section 13 requires a scoring run to be reproducible from
# the same inputs, and the arithmetic in this package is a sort and a division.
# Pulling in numpy would trade that for a pairwise-summation order that varies
# with build and array shape. If a later ticket genuinely needs an array
# library, it argues for it in the methodology changelog first.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["burden"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
