[project]
name = "clearskies-etl"
version = "0.1.0"
description = "ClearSkies ingestion: the data source adapter interface and its implementations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "h3>=4.1",
    # CS-207, the tile build. `pmtiles` writes the archive and
    # `mapbox-vector-tile` encodes the tiles inside it. Both are small and both
    # are the reference implementation of a published spec, which is the whole
    # reason not to hand-roll a protobuf encoder for a format a browser has to
    # parse.
    "pmtiles>=3.4",
    "mapbox-vector-tile>=2.1",
    # CS-114, the RSEI toxicity weights. EPA publishes them only as an xlsx
    # workbook, and openpyxl is the reference reader for that format. The same
    # reasoning as pmtiles above: a hand-rolled reader of somebody else's
    # published format is a parser this project would then own, and the parts
    # that would break are exactly the ones that look skippable, shared strings
    # and cell types among them.
    "openpyxl>=3.1",
    # The ingestion package's own Postgres door, `pipeline/db.py`. The API pins
    # the same driver for the same reason: one driver across both halves means
    # one set of type coercions to reason about when a row read by the API and a
    # row written by a pipeline job disagree.
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# h3 ships no stubs; its cell functions are dynamic at the boundary. openpyxl
# ships none either, and a worksheet cell is `Any` at the boundary whether or not
# it does: the RSEI adapter narrows every value it reads to str or float itself,
# because what Excel put in a cell is a runtime fact rather than a typed one.
# asyncpg ships no stubs either, which is why the analysis package describes the
# slice of a connection it needs as a Protocol rather than importing the driver.
[[tool.mypy.overrides]]
module = ["h3.*", "pmtiles.*", "mapbox_vector_tile.*", "openpyxl.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
