name: Uptime

# CS-403. Checks the public site from outside every 30 minutes, the way a reader
# meets it: the API's /health must say "ok" with the database connected (it
# degrades rather than failing, so a 200 is not enough), the website must serve
# its page, and the tile archive the live bundle points at must answer a Range
# request. scripts/uptime_check.py has the reasoning for each.
#
# Actions minutes are unmetered for a public repository, and the job uses the
# standard library only, so a run costs under a minute and installs nothing.
#
# A failure opens one issue labelled `uptime`, and later failures comment on
# it, the same rule the nightly ETL uses. It is closed by hand once the site is
# back, so an outage reads as one incident however many checks it spanned.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Site is up
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/uptime_check.py
          sparse-checkout-cone-mode: false

      - name: Check the API, the website and the tile archive
        run: python3 scripts/uptime_check.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open or update the outage notice
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Site is down or degraded';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const body =
              `The uptime check failed. The run summary lists which of the API, ` +
              `the website and the tile archive failed, and why.\n\nRun: ${url}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            });
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime'],
              });
            }
