name: CI

on:
  push:
    branches: [master, project-setup]
  pull_request:

jobs:
  preregistration:
    name: Validation set pre-registered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check reads commit ordering
      - run: ./scripts/check_preregistration.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install h3 pyyaml
      - name: Validation set is internally consistent
        run: python scripts/check_validation_set.py

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: python -m pytest -q
      # Railpack installs nothing from a bare pyproject.toml, so the deploy
      # reads api/requirements.txt. Catch the two lists drifting here rather
      # than in a health check that has already failed.
      - name: requirements.txt matches pyproject.toml
        working-directory: .
        run: python scripts/check_requirements_sync.py

  etl:
    name: Ingestion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy pipeline tests
      - run: python -m pytest -q
      # The reference adapter runs against a fixture, so this proves the four
      # stages still fit together without depending on an upstream being up.
      - run: python -m pipeline run fake
      # And the CS-108 gate runs over it, so a change that breaks the checks is
      # caught on the pull request rather than at 07:00 the next morning. No
      # --require here: on a pull request the point is that the gate still runs,
      # not that every source was pulled.
      - run: python -m pipeline check fake --no-store

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    name: Database image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify extensions load
        run: |
          docker compose up -d --build db
          # Wait for init scripts to finish, not just for the socket to open.
          for _ in $(seq 1 90); do
            docker compose exec -T db psql -h 127.0.0.1 -U clearskies -d clearskies \
              -tAc "SELECT 1 FROM clearskies_extensions LIMIT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose exec -T db psql -U clearskies -d clearskies \
            -v ON_ERROR_STOP=1 -c "SELECT * FROM clearskies_extensions"
          docker compose exec -T db psql -U clearskies -d clearskies \
            -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM clearskies_extensions" | grep -qx 4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e "./api[dev]"

      # The schema is only version-controlled if the files in api/migrations
      # actually build it. This applies them to a database that has never seen
      # them, unwinds the whole set, and applies it again, which is the shape
      # of a reviewer checking out the branch.
      - name: Migrations build the schema from empty
        working-directory: api
        run: |
          python -m app.migrate up
          python -m app.migrate verify

      - name: Applying twice changes nothing
        working-directory: api
        run: python -m app.migrate up | grep -qx "0 applied"

      # The spatial tests need PostGIS to answer, so they skip in the `api` job
      # and run here, where a migrated database is already up. They seed inside a
      # transaction and roll it back, so the down-migration step below still sees
      # the schema it expects.
      - name: The neighbour query behaves against real PostGIS
        working-directory: api
        env:
          CLEARSKIES_TEST_DATABASE_URL: postgresql://clearskies:clearskies@localhost:5432/clearskies
        run: python -m pytest tests/test_facility_hex_sql.py -q

      - name: Down migrations unwind the whole set
        working-directory: api
        run: |
          python -m app.migrate down --to 0000
          python -m app.migrate up
          python -m app.migrate verify
