name: CI

on:
  push:
    branches: [master, project-setup]
  pull_request:

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # Reads no secrets, so it runs on pull requests from forks like every other
    # check here. A scan that only ran for maintainers would miss the commit
    # most likely to carry a credential: a first-time contributor's.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history scan needs every commit, not just the tip
      - name: Install the scanner
        # Pinned by version and checksum rather than taken from a moving tag.
        # The same reasoning the adapters use for upstream data: record exactly
        # what you fetched, and notice when it changes underneath you.
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          asset="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${asset}"
          echo "${SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
      - name: Working tree
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml
      - name: Full history
        # A credential deleted in a later commit is still a credential. This is
        # the check that catches one that was committed and then tidied away.
        run: ./gitleaks git . --no-banner --redact --config .gitleaks.toml
      - name: Register matches .env.example and the workflows
        run: python3 scripts/check_secrets.py audit

  preregistration:
    name: Validation set pre-registered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check reads commit ordering
      - run: ./scripts/check_preregistration.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install h3 pyyaml
      - name: Validation set is internally consistent
        run: python scripts/check_validation_set.py

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: python -m pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    name: Database image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify extensions load
        run: |
          docker compose up -d --build db
          # Wait for init scripts to finish, not just for the socket to open.
          for _ in $(seq 1 90); do
            docker compose exec -T db psql -h 127.0.0.1 -U clearskies -d clearskies \
              -tAc "SELECT 1 FROM clearskies_extensions LIMIT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose exec -T db psql -U clearskies -d clearskies \
            -v ON_ERROR_STOP=1 -c "SELECT * FROM clearskies_extensions"
          docker compose exec -T db psql -U clearskies -d clearskies \
            -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM clearskies_extensions" | grep -qx 4
