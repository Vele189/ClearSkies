name: Nightly ETL

# Scheduled orchestration of every adapter, with no server to manage.
#
# The job is deliberately thin. It installs the package and calls
# `python -m pipeline nightly`, which decides what is due, pulls it, gates it,
# records the night and promotes it only if the gate passed. Putting that
# sequence in Python rather than in YAML is what lets it be tested: `etl/tests`
# covers the planner, the ledger and the promotion rule, and none of that would
# be reachable if the orchestration lived in these steps.
#
# ---- what this job does not do -----------------------------------------
#
# It does not load into Postgres. `nightly` runs every due adapter into the
# in-memory sink and applies the CS-108 gate to what came back, so a night
# proves that upstream still serves what this pipeline believes it serves, and
# records that verdict in the ledger and in docs/provenance.md. The database is
# written by `python -m pipeline run <source> --load` against DATABASE_URL, by
# hand, and this job is given no such secret. Until the ledger and the sink move
# into Postgres together, a green night means "the sources are healthy and the
# gate passed", not "the map has tonight's data in it".
#
# ---- the free-tier budget ----------------------------------------------
#
# Actions is unmetered for public repositories and 2,000 minutes a month on the
# free tier for private ones, so the budget below is written against the tighter
# of the two.
#
# Per-source envelopes are declared in `pipeline/schedule.py` and add up to about
# 57 minutes if all eight sources pull on the same night, which is the first
# night and the night after the cache is lost. The four monthly sources coming
# due together costs about 18. A typical night pulls only OpenAQ and the
# reference adapter, about 6 minutes.
#
#     30 nights x  ~6 min typical pull                  ~183 min
#      4 nights x  ~3 min for ECHO's weekly refresh      ~12 min
#      1 night  x ~18 min for the four monthly sources   ~18 min
#     1/12 night x ~30 min for the decennial blocks       ~3 min
#     30 nights x  ~2 min of checkout, install, gate     ~60 min
#                                                      ---------
#                                                       ~276 min
#
# Under 300 minutes a month against a 2,000 minute floor, and the reason it is
# that low is the cadence policy: pulling all eight every night would be about
# 1,760 minutes, which is just inside the tier and spends six times the budget
# and six times EPA's bandwidth to produce the same numbers.
#
# `timeout-minutes` is set above the all-eight figure so that a genuinely slow
# night finishes rather than being cut in half. If it ever does cut a night off,
# the planner's cheapest-first ordering decides what survived: the census blocks,
# the one source that cannot have changed, are what it drops first.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC, roughly 01:00 in the pilot state
  workflow_dispatch:
    inputs:
      force:
        description: "Comma-separated sources to pull regardless of cadence, or 'all'"
        required: false
        default: ""

# A scheduled run and a hand-triggered one must not run at the same time. They
# share a ledger and a snapshot directory, and two nights promoting themselves in
# parallel is how a run that failed its gate ends up current.
concurrency:
  group: nightly-etl
  cancel-in-progress: false

permissions:
  # The provenance page is generated from the manifests and committed back, so
  # it cannot drift from the data. That is the only thing this job writes.
  contents: write
  # Only for the failure notice below.
  issues: write

jobs:
  ingest:
    name: Ingest and gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the ingestion package
        working-directory: etl
        run: pip install -e .

      # The ledger is the only state that has to outlive a run: a cadence counts
      # from the last successful pull, and a runner keeps nothing by default.
      # The key is unique per run so the cache is always written; the prefix
      # restore picks up the most recent one.
      #
      # This is interim. The durable home is `pipeline_run` in migration 0002,
      # and the ledger moves there with the Postgres sink. A cache miss, which
      # GitHub will eventually cause by evicting an entry, costs one redundant
      # pull of everything and nothing else, which is why it is safe to rely on
      # in the meantime.
      - name: Restore the run ledger
        uses: actions/cache@v4
        with:
          path: etl/pipeline-state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      # The other half of the state, and the one methodology section 6 rests on:
      # the last good copy of every download, which is what a source that has
      # gone away is served from. Cached separately from the ledger because it
      # is orders of magnitude larger and because losing it is a different kind
      # of loss: a missing ledger costs one redundant pull, a missing snapshot
      # directory costs the stale fallback until the next successful night
      # refills it. Same key shape, so each night writes a fresh entry and
      # restores the most recent one.
      - name: Restore the source snapshots
        uses: actions/cache@v4
        with:
          path: etl/pipeline-snapshots
          key: pipeline-snapshots-${{ github.run_id }}
          restore-keys: |
            pipeline-snapshots-

      - name: What tonight will pull
        working-directory: etl
        run: python -m pipeline plan

      # The gate's verdict is the run's verdict. Exit 1 means the night did not
      # become the current one, so the map keeps serving the run that last
      # passed.
      #
      # `--require` names the sources that must produce what they were asked for
      # on a night their cadence says they are due. A source that is carried is
      # not required of that run, so the flag stays correct as each cadence
      # comes and goes. Every registered source is named: a night on which one
      # of them was due, ran, and produced nothing usable is a night whose gate
      # skipped its checks, and a report made of skips must not read as a green
      # tick.
      #
      # The two credentials are the ones `CREDENTIAL_ENV` maps. OpenAQ refuses
      # every request without a key, so an absent secret fails that source with
      # a legible reason rather than quietly pulling nothing; the Census key
      # only raises the rate at which ACS answers.
      - name: Nightly run
        working-directory: etl
        env:
          FORCE: ${{ github.event.inputs.force }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          args=""
          if [ "$FORCE" = "all" ]; then
            args="--all"
          elif [ -n "$FORCE" ]; then
            for source in ${FORCE//,/ }; do
              args="$args --force $source"
            done
          fi
          python -m pipeline nightly $args \
            --require fake \
            --require openaq \
            --require epa_echo \
            --require epa_tri \
            --require epa_rsei \
            --require airtoxscreen \
            --require census_acs \
            --require census_block

      # CS-110. The page answers "where did this number come from", and the only
      # honest way to keep that answer true is to generate it. This runs after
      # the pulls and only on success: regenerating from a night that failed its
      # gate would publish rows describing data that is not being served.
      - name: Regenerate the provenance page
        id: provenance
        working-directory: etl
        run: python -m pipeline provenance --page ../docs/provenance.md

      # Committed rather than uploaded, because the page is what a reader browses
      # in the repository. Only when it changed, so a quiet night produces no
      # commit. `[skip ci]` keeps a commit that moved a generated table from
      # triggering the pull-request workflow.
      - name: Commit the page
        if: steps.provenance.outputs.provenance_changed == 'true'
        env:
          BOT: "github-actions[bot]"
        run: |
          git config user.name "$BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/provenance.md
          git commit -m "Regenerate the provenance page from the nightly run [skip ci]"
          git push

      # The gate wrote its plan and its report to the step summary and raised an
      # annotation per failure, so the run page carries the reason without anyone
      # opening the log. This keeps the evidence for the next fortnight, which is
      # how the envelope thresholds in pipeline/quality/expectations.py get
      # narrowed from observed values rather than from memory.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            etl/quality-runs/
            etl/pipeline-state/
          retention-days: 30

      # A scheduled job that fails silently is a job nobody runs. A failed run
      # page is only seen by someone who goes looking, so the failure is turned
      # into an issue, which notifies whoever watches the repository.
      #
      # One issue, reopened and commented on, rather than one a night: a source
      # that has been down for a week should read as one problem lasting a week,
      # not as seven. The issue closes by hand once the night is green again,
      # which is deliberate - an auto-closing notice is one nobody reads.
      - name: Open or update the failure notice
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly ETL failed';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const body =
              `The nightly ETL run failed and was not promoted, so the map is still ` +
              `serving the last run that passed its quality gate.\n\n` +
              `Run: ${url}\nCommit: ${context.sha}\n\n` +
              `The step summary on that run lists every check, and the quality-report ` +
              `artifact holds the full report and the ledger.`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-etl',
            });

            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nightly-etl'],
              });
            }

  # ---- Scoring (CP-25) ---------------------------------------------------
  #
  # Runs only where a DATABASE_URL secret exists, and skips with a legible
  # reason where it does not, because the `ingest` job above deliberately has
  # no such secret and does not load anything: it pulls into the in-memory sink
  # and gates what came back. Until the ledger and the sink move into Postgres
  # together, loading is still `python -m pipeline run <source> --load` by hand,
  # and this job scores whatever that last put there rather than tonight's pull.
  # That is worth having anyway -- it recomputes the section 13 gates against
  # real data every night, which is the number this project is currently
  # failing and the one nobody sees between manual runs.
  #
  # **It promotes nothing.** `run_scoring.py` is called without --promote, so
  # the run the API serves is unchanged and the artifacts below are evidence
  # rather than a deployment. Promoting a run that has not cleared section 13
  # would put an unvalidated score on the map, which is the single failure this
  # project's whole discipline exists to prevent. Automating promotion is part
  # of CS-410 and is gated on the validation harness passing, not on the
  # quality gate passing.
  score:
    name: Score and build tiles
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Is there a database to score?
        id: configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No DATABASE_URL secret, so there is nothing to score." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Scoring runs by hand against a loaded database; see docs/nightly.md." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: "3.12"

      # The scoring script imports `burden` from scoring/ and asyncpg from the
      # ingestion package, which is why both are installed rather than one.
      - name: Install the packages the run needs
        if: steps.configured.outputs.ready == 'true'
        run: |
          pip install -e etl
          pip install -e scoring

      # Without --promote. See the note on this job.
      - name: Score the loaded data
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/run_scoring.py

      - name: Export the run for the gates
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/export_run.py \
            --validation validation.json \
            --robustness robustness.json \
            --tiles tile_scores.json

      # Reported, not enforced. The section 13 gate is currently failing, and a
      # job that went red every night for a known failure is a job people stop
      # reading -- the ingest job's issue would be buried under it. The result
      # goes to the step summary so the number is visible every morning, and
      # CP-08 is where a passing gate is argued for.
      - name: Section 13, reported
        if: steps.configured.outputs.ready == 'true'
        run: |
          {
            echo "## Section 13, against tonight's scoring run"
            echo
            python scripts/run_validation.py --scores validation.json || true
            echo
            python scripts/run_robustness.py --values robustness.json || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the tile archive
        if: steps.configured.outputs.ready == 'true'
        working-directory: etl
        run: python -m pipeline tiles --scores ../tile_scores.json --out ../hexes.pmtiles

      # Artifacts rather than an upload to R2: the archive the map serves is
      # published deliberately, by `make deploy-tiles`, alongside a promoted
      # run. A nightly build that overwrote it would put tiles on the map for a
      # run the API is not serving, and the two would disagree.
      - name: Keep the run and the archive
        if: steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scored-run
          path: |
            validation.json
            robustness.json
            tile_scores.json
            hexes.pmtiles
          retention-days: 14
